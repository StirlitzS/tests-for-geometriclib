name: Unit tests

# Событие запуска — push
on:
  push:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show files
        run: ls -la
        shell: bash

      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py"
        shell: bash
